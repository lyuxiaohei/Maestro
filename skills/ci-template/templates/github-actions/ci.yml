# GitHub Actions CI Workflow
# Triggers: push to main, pull requests
#
# Required secrets (Settings > Secrets > Actions):
#   REGISTRY: Docker registry URL
#   REGISTRY_TOKEN: Registry access token

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SERVICE_NAME: "{{SERVICE_NAME}}"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

jobs:
  # --- Detect changes ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.filter.outputs.java }}
      react: ${{ steps.filter.outputs.react }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            java:
              - '**/*.java'
              - 'pom.xml'
            react:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'

  # --- Lint ---
  lint-java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn checkstyle:check -q

  lint-react:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint . --max-warnings 0

  # --- Test ---
  test-java:
    needs: [changes, lint-java]
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn test -B
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java
          path: target/surefire-reports/

  test-react:
    needs: [changes, lint-react]
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-react
          path: coverage/

  # --- Build ---
  build-java:
    needs: test-java
    if: needs.changes.outputs.java == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - run: mvn package -DskipTests -B
      - uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: target/*.jar

  build-react:
    needs: test-react
    if: needs.changes.outputs.react == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
