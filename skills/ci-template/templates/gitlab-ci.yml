# GitLab CI Pipeline Template
# 5 stages: lint → test → build → deploy-staging → deploy-prod
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   REGISTRY: Docker registry URL
#   REGISTRY_USER: Registry username
#   REGISTRY_PASSWORD: Registry password (masked)
#   DEPLOY_PATH: Deployment target path
#   SERVICE_NAME: Service name for image tagging

stages:
  - lint
  - test
  - build
  - deploy-staging
  - deploy-prod

variables:
  SERVICE_NAME: "{{SERVICE_NAME}}"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NODE_VERSION: "20"

# Cache configuration
.cache-maven: &cache-maven
  cache:
    key: "${CI_COMMIT_REF_SLUG}-maven"
    paths:
      - .m2/repository

.cache-node: &cache-node
  cache:
    key: "${CI_COMMIT_REF_SLUG}-node"
    paths:
      - node_modules/

# --- Java Jobs ---

lint:java:
  stage: lint
  image: maven:3.9-eclipse-temurin-17
  <<: *cache-maven
  script:
    - mvn checkstyle:check -q
  rules:
    - exists:
        - pom.xml

test:java:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  <<: *cache-maven
  script:
    - mvn test -B
    - cat target/site/jacoco/index.html || true
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
  rules:
    - exists:
        - pom.xml

build:java:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  <<: *cache-maven
  script:
    - mvn package -DskipTests -B
    - docker build -t $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA .
  rules:
    - exists:
        - pom.xml
      if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- React Jobs ---

lint:react:
  stage: lint
  image: node:${NODE_VERSION}
  <<: *cache-node
  script:
    - npm ci
    - npx eslint . --max-warnings 0
  rules:
    - exists:
        - package.json

test:react:
  stage: test
  image: node:${NODE_VERSION}
  <<: *cache-node
  script:
    - npm ci
    - npx vitest run --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - exists:
        - package.json

build:react:
  stage: build
  image: node:${NODE_VERSION}
  <<: *cache-node
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
  rules:
    - exists:
        - package.json
      if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Deploy Jobs ---

deploy:staging:
  stage: deploy-staging
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying $SERVICE_NAME to staging..."
    # TODO: Add deployment commands (kubectl, ssh, etc.)
    - echo "Deployment to staging complete"
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

deploy:prod:
  stage: deploy-prod
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying $SERVICE_NAME to production..."
    # TODO: Add deployment commands
    - echo "Deployment to production complete"
  environment:
    name: production
    url: https://app.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual  # Manual gate for production
