<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maestro 单阶段生命周期</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #1a2a3a;
      --color-muted:   #3a6b8a;
      --color-soft:    #5a8aaa;
      --color-accent:  #1a5276;
      --color-accent-tint: rgba(26,82,118,0.08);
      --color-rule:    rgba(26,42,58,0.10);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro Workflow</p>
    <h1>单阶段完整生命周期</h1>

    <svg viewBox="0 0 960 920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5276"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ═══════ ARROWS (drawn first, behind nodes) ═══════ -->

      <!-- START → GATE-03 -->
      <line x1="480" y1="56" x2="480" y2="84" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- GATE-03 → GATE-01 (YES) -->
      <line x1="480" y1="136" x2="480" y2="164" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- GATE-03 → BLOCKED (NO) -->
      <line x1="592" y1="112" x2="780" y2="112" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- GATE-03 NO label -->
      <rect x="656" y="96" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="670" y="105" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <!-- GATE-03 YES label -->
      <rect x="488" y="140" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="502" y="149" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

      <!-- GATE-01 → SKILL EXEC -->
      <line x1="480" y1="216" x2="480" y2="244" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- SKILL EXEC → GATE-02 -->
      <line x1="480" y1="296" x2="480" y2="324" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- GATE-02 → GATE-05 (PASS) -->
      <line x1="480" y1="376" x2="480" y2="404" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- GATE-02 → back to SKILL (FAIL) -->
      <line x1="368" y1="352" x2="260" y2="352" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="260" y1="352" x2="260" y2="268" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="260" y1="268" x2="368" y2="268" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- GATE-02 PASS label -->
      <rect x="488" y="380" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="504" y="389" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PASS</text>
      <!-- GATE-02 FAIL label -->
      <rect x="296" y="340" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="310" y="349" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAIL</text>

      <!-- GATE-05 → GATE-01b (PASS) -->
      <line x1="480" y1="456" x2="480" y2="484" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- GATE-05 → model upgrade (FAIL) -->
      <line x1="592" y1="432" x2="780" y2="432" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- GATE-05 PASS label -->
      <rect x="488" y="460" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="504" y="469" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PASS</text>
      <!-- GATE-05 FAIL label -->
      <rect x="656" y="416" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="670" y="425" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FAIL</text>

      <!-- GATE-01b → WRITE STATE -->
      <line x1="480" y1="536" x2="480" y2="564" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- WRITE STATE → END -->
      <line x1="480" y1="616" x2="480" y2="644" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ═══════ NODES ═══════ -->

      <!-- START oval -->
      <rect x="392" y="20" width="176" height="36" rx="20" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="480" y="43" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户触发「开始阶段 N」</text>

      <!-- GATE-03 依赖检查 -->
      <rect x="368" y="88" width="224" height="48" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="376" y="94" width="56" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="404" y="103" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-03</text>
      <text x="480" y="120" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">依赖检查</text>
      <text x="480" y="132" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P01~P{N-1} status=COMPLETE?</text>

      <!-- GATE-01 人工确认启动 -->
      <rect x="368" y="168" width="224" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="376" y="174" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="404" y="183" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-01</text>
      <text x="480" y="200" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">人工确认启动</text>
      <text x="480" y="212" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">展示目标 / 等待「确认」</text>

      <!-- Skill 执行 -->
      <rect x="368" y="248" width="224" height="48" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <rect x="376" y="254" width="40" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="396" y="263" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="480" y="280" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">加载领域 Skill 执行</text>

      <!-- GATE-02 自检 -->
      <rect x="368" y="328" width="224" height="48" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="376" y="334" width="56" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="404" y="343" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-02</text>
      <text x="480" y="360" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skill 自检</text>
      <text x="480" y="372" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">输出完整性 / 版本号 / STATE</text>

      <!-- GATE-05 Agent 验证 -->
      <rect x="368" y="408" width="224" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="376" y="414" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="404" y="423" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-05</text>
      <text x="480" y="440" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent 独立验证</text>
      <text x="480" y="452" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phase-validator / 只读隔离</text>

      <!-- GATE-01b 人工确认输出 -->
      <rect x="368" y="488" width="224" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="376" y="494" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="404" y="503" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-01</text>
      <text x="480" y="520" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">人工确认输出</text>
      <text x="480" y="532" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">展示摘要 / 等待「确认」</text>

      <!-- 写入与推进 -->
      <rect x="368" y="568" width="224" height="48" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="588" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">写入与推进</text>
      <text x="480" y="600" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">STATE.md → workflow.md</text>

      <!-- END oval -->
      <rect x="392" y="648" width="176" height="36" rx="20" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="480" y="671" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">进入下一阶段</text>

      <!-- ═══════ SIDE NODES ═══════ -->

      <!-- BLOCKED -->
      <rect x="784" y="92" width="140" height="40" rx="6" fill="rgba(26,42,58,0.02)" stroke="rgba(26,42,58,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="854" y="116" fill="#3a6b8a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BLOCKED</text>

      <!-- Model upgrade -->
      <rect x="784" y="408" width="140" height="48" rx="6" fill="rgba(26,42,58,0.02)" stroke="rgba(26,42,58,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="854" y="428" fill="#3a6b8a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">模型升级重试</text>
      <text x="854" y="448" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sonnet → opus</text>

      <!-- ═══════ LEGEND ═══════ -->
      <line x1="80" y1="720" x2="880" y2="720" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>
      <text x="80" y="744" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <!-- Legend items -->
      <rect x="80" y="756" width="16" height="12" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="104" y="766" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">门禁步骤</text>

      <rect x="200" y="756" width="16" height="12" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="224" y="766" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">人工确认</text>

      <rect x="320" y="756" width="16" height="12" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="344" y="766" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">执行步骤</text>

      <line x1="440" y1="762" x2="480" y2="762" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="488" y="766" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">失败 / 阻塞路径</text>

      <line x1="640" y1="762" x2="680" y2="762" stroke="#1a5276" stroke-width="1.2"/>
      <text x="688" y="766" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">通过路径</text>

    </svg>
  </div>
</body>
</html>
