<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archon Workflow Execution</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      font-family: 'Geist', sans-serif;
      color: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 600px; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #5a8aaa;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #1a2a3a;
    }
    main { width: 100%; max-width: 700px; }
    svg { width: 100%; height: auto; display: block; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(26,42,58,0.10);
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #5a8aaa;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">ARCHON · WORKFLOW</p>
    <h1>Archon Workflow Execution</h1>
  </header>
  <main>
    <svg viewBox="0 0 600 744" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ===== ARROWS (drawn first for z-order) ===== -->

      <!-- 1→2: 用户触发 → YAML DAG 加载 -->
      <line x1="300" y1="60" x2="300" y2="92" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 2→3: YAML DAG → 创建 Worktree -->
      <line x1="300" y1="136" x2="300" y2="164" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 3→4: 创建 Worktree → 排序节点 -->
      <line x1="300" y1="208" x2="300" y2="240" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 4→5: 排序节点 → 执行节点 -->
      <line x1="300" y1="284" x2="300" y2="312" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 5→6: 执行节点 → 节点类型 diamond -->
      <line x1="300" y1="356" x2="300" y2="372" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 6→7: diamond left → AI Session -->
      <line x1="264" y1="408" x2="200" y2="472" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- label "AI" with opaque background -->
      <rect x="216" y="432" width="24" height="16" rx="4" fill="#f8fafc"/>
      <text x="228" y="444" font-family="'Geist Mono', monospace" font-size="8" fill="#3a6b8a" text-anchor="middle">AI</text>

      <!-- 6→8: diamond right → Shell / Script -->
      <line x1="336" y1="408" x2="400" y2="472" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- label "Bash" with opaque background -->
      <rect x="352" y="432" width="32" height="16" rx="4" fill="#f8fafc"/>
      <text x="368" y="444" font-family="'Geist Mono', monospace" font-size="8" fill="#3a6b8a" text-anchor="middle">Bash</text>

      <!-- 7→9: AI Session → merge dot -->
      <line x1="160" y1="516" x2="296" y2="548" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 8→9: Shell → merge dot -->
      <line x1="440" y1="516" x2="304" y2="548" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 9→10: merge → 还有节点? diamond -->
      <line x1="300" y1="556" x2="300" y2="568" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 10→11: 还有节点? No → 提交结果 -->
      <line x1="300" y1="632" x2="300" y2="664" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- label "No" with opaque background -->
      <rect x="308" y="640" width="24" height="16" rx="4" fill="#f8fafc"/>
      <text x="320" y="652" font-family="'Geist Mono', monospace" font-size="8" fill="#1a5276" text-anchor="middle">No</text>

      <!-- 10→5: 还有节点? Yes → loop back to 执行节点 (right side curve) -->
      <path d="M 336,600 L 480,600 L 480,332 L 368,332" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
      <!-- label "Yes" with opaque background -->
      <rect x="484" y="460" width="28" height="16" rx="4" fill="#f8fafc"/>
      <text x="496" y="472" font-family="'Geist Mono', monospace" font-size="8" fill="#3a6b8a" text-anchor="middle">Yes</text>

      <!-- ===== NODES ===== -->

      <!-- Node 1: 用户触发工作流 (Oval, start) cx=300 cy=40 -->
      <ellipse cx="300" cy="40" rx="96" ry="20" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="44" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">用户触发工作流</text>

      <!-- Node 2: YAML DAG 加载 cx=300, y=92..136 -->
      <rect x="232" y="92" width="136" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="120" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">YAML DAG 加载</text>

      <!-- Node 3: 创建隔离 Worktree cx=300, y=164..208 -->
      <rect x="228" y="164" width="144" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="192" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">创建隔离 Worktree</text>

      <!-- Node 4: 按依赖排序节点 cx=300, y=240..284 -->
      <rect x="228" y="240" width="144" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="268" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">按依赖排序节点</text>

      <!-- Node 5: 执行节点 cx=300, y=312..356 -->
      <rect x="232" y="312" width="136" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="340" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">执行节点</text>

      <!-- Node 6: 节点类型 (Diamond) center 300,408 — 76x76 rect rotated 45 -->
      <rect x="260" y="372" width="80" height="80" rx="0" fill="#ffffff" stroke="#1a2a3a" stroke-width="1" transform="rotate(45 300 408)"/>
      <text x="300" y="412" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">节点类型</text>

      <!-- Node 7: AI Session cx=160, y=472..516 -->
      <rect x="92" y="472" width="136" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="160" y="496" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">AI Session</text>
      <text x="160" y="528" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">循环节点可迭代</text>

      <!-- Node 8: Shell / Script cx=440, y=472..516 -->
      <rect x="372" y="472" width="136" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="440" y="496" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Shell / Script</text>

      <!-- Node 9: Merge dot cx=300, y=552 -->
      <circle cx="300" cy="552" r="4" fill="#1a2a3a"/>

      <!-- Node 10: 还有节点? (Diamond) center 300,600 — 72x72 rect rotated 45 -->
      <rect x="264" y="568" width="72" height="72" rx="0" fill="#ffffff" stroke="#1a2a3a" stroke-width="1" transform="rotate(45 300 600)"/>
      <text x="300" y="604" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">还有节点?</text>

      <!-- Node 11: 提交结果 (Oval, accent end) cx=300 cy=684 -->
      <ellipse cx="300" cy="684" rx="80" ry="20" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="300" y="688" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">提交结果</text>

      <!-- ===== LEGEND ===== -->
      <ellipse cx="44" cy="728" rx="12" ry="8" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="64" y="732" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">开始 / 结束</text>

      <rect x="156" y="720" width="16" height="16" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="180" y="732" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">流程步骤</text>

      <rect x="268" y="724" width="12" height="12" rx="0" fill="#ffffff" stroke="#1a2a3a" stroke-width="1" transform="rotate(45 274 728)"/>
      <text x="292" y="732" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">判断分支</text>

      <circle cx="388" cy="728" r="4" fill="#1a2a3a"/>
      <text x="400" y="732" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">汇聚点</text>

      <line x1="452" y1="728" x2="472" y2="728" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="484" y="732" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">流转方向</text>
    </svg>
  </main>
  <footer>Maestro · Plugin Ecosystem Analysis</footer>
</body>
</html>
