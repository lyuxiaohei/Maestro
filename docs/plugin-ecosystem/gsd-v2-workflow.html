<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSD v2/v3 Milestone Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      font-family: 'Geist', sans-serif;
      color: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 600px; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #5a8aaa;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #1a2a3a;
    }
    main { width: 100%; max-width: 700px; }
    svg { width: 100%; height: auto; display: block; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(26,42,58,0.10);
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #5a8aaa;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">GSD V2/V3 · WORKFLOW</p>
    <h1>GSD v2/v3 Milestone Workflow</h1>
  </header>
  <main>
    <svg viewBox="0 0 600 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
        <marker id="arrow-back" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ===== ARROWS (drawn first for z-order) ===== -->

      <!-- Forward arrows (top-to-bottom) -->

      <!-- 1→2: new-milestone → Milestone 规划 -->
      <line x1="300" y1="64" x2="300" y2="92" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 2→3: Milestone 规划 → Slice 分解 -->
      <line x1="300" y1="132" x2="300" y2="164" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 3→4: Slice 分解 → Task 细化 -->
      <line x1="300" y1="204" x2="300" y2="236" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 4→5: Task 细化 → 独立上下文执行 -->
      <line x1="300" y1="276" x2="300" y2="308" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 5→6: 独立上下文执行 → Task 完成? -->
      <line x1="300" y1="348" x2="300" y2="364" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 6→7: Task 完成? Yes → Slice 完成? -->
      <line x1="300" y1="444" x2="300" y2="452" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="288" y="444" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="300" y="453" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">Yes</text>

      <!-- 7→8: Slice 完成? Yes → Milestone 完成? -->
      <line x1="300" y1="532" x2="300" y2="540" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="288" y="532" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="300" y="541" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">Yes</text>

      <!-- 8→9: Milestone 完成? Yes → Validate Milestone -->
      <line x1="300" y1="620" x2="300" y2="640" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <rect x="288" y="622" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="300" y="631" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">Yes</text>

      <!-- Back arrows (right-side loops) -->

      <!-- 6→5: Task 完成? No → 独立上下文执行 -->
      <path d="M 348 404 L 480 404 L 480 328 L 364 328" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#arrow-back)" stroke-dasharray="4 2"/>
      <rect x="468" y="360" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="478" y="369" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">No</text>

      <!-- 7→3: Slice 完成? No → Slice 分解 -->
      <path d="M 348 492 L 508 492 L 508 184 L 364 184" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#arrow-back)" stroke-dasharray="4 2"/>
      <rect x="496" y="332" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="506" y="341" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">No</text>

      <!-- 8→2: Milestone 完成? No → Milestone 规划 -->
      <path d="M 348 580 L 536 580 L 536 112 L 364 112" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#arrow-back)" stroke-dasharray="4 2"/>
      <rect x="524" y="340" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="534" y="349" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">No</text>

      <!-- ===== NODES ===== -->

      <!-- 1. Start: gsd new-milestone (oval) -->
      <ellipse cx="300" cy="40" rx="72" ry="24" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="44" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">gsd new-milestone</text>

      <!-- 2. Milestone 规划 (rect) -->
      <rect x="236" y="92" width="128" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="116" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Milestone 规划</text>

      <!-- 3. Slice 分解 (rect) -->
      <rect x="236" y="164" width="128" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="188" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Slice 分解</text>

      <!-- 4. Task 细化 (rect) -->
      <rect x="236" y="236" width="128" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="260" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Task 细化</text>

      <!-- 5. 独立上下文执行 (rect, focal/accent-tint) -->
      <rect x="236" y="308" width="128" height="40" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="300" y="332" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a5276" text-anchor="middle">独立上下文执行</text>

      <!-- 6. Task 完成? (diamond, center y=404) -->
      <rect x="260" y="364" width="80" height="80" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1" transform="rotate(45, 300, 404)"/>
      <text x="300" y="401" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">Task</text>
      <text x="300" y="415" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">完成?</text>

      <!-- 7. Slice 完成? (diamond, center y=492) -->
      <rect x="260" y="452" width="80" height="80" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1" transform="rotate(45, 300, 492)"/>
      <text x="300" y="489" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">Slice</text>
      <text x="300" y="503" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">完成?</text>

      <!-- 8. Milestone 完成? (diamond, center y=580) -->
      <rect x="260" y="540" width="80" height="80" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1" transform="rotate(45, 300, 580)"/>
      <text x="300" y="577" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">Milestone</text>
      <text x="300" y="591" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">完成?</text>

      <!-- 9. End: Validate Milestone (oval, accent) -->
      <ellipse cx="300" cy="660" rx="72" ry="24" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="300" y="664" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a5276" text-anchor="middle">Validate Milestone</text>

      <!-- ===== LEGEND ===== -->
      <g transform="translate(52, 700)">
        <!-- Oval -->
        <ellipse cx="12" cy="8" rx="12" ry="8" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.75"/>
        <text x="32" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Start / End</text>

        <!-- Rect -->
        <rect x="120" y="0" width="20" height="16" rx="3" fill="#ffffff" stroke="#1a2a3a" stroke-width="0.75"/>
        <text x="148" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Step</text>

        <!-- Diamond -->
        <rect x="198" y="0" width="12" height="12" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.75" transform="rotate(45, 204, 8)"/>
        <text x="224" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Decision</text>

        <!-- Dashed arrow -->
        <line x1="300" y1="8" x2="324" y2="8" stroke="#3a6b8a" stroke-width="0.75" stroke-dasharray="4 2"/>
        <text x="332" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Loop Back</text>

        <!-- Accent focal -->
        <rect x="420" y="0" width="20" height="16" rx="3" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="0.75"/>
        <text x="448" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Focal / End</text>
      </g>
    </svg>
  </main>
  <footer>Maestro · Plugin Ecosystem Analysis</footer>
</body>
</html>
