<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superpowers Runtime Bootstrap</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      font-family: 'Geist', sans-serif;
      color: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 600px; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #5a8aaa;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #1a2a3a;
    }
    main { width: 100%; max-width: 700px; }
    svg { width: 100%; height: auto; display: block; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(26,42,58,0.10);
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #5a8aaa;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Superpowers · Runtime</p>
    <h1>Superpowers Runtime Bootstrap</h1>
  </header>
  <main>
    <svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ==================== ARROWS (drawn first for z-order) ==================== -->

      <!-- 1→2: Claude Code 会话启动 → SessionStart Hook 触发 -->
      <line x1="300" y1="64" x2="300" y2="92" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 2→3: SessionStart Hook 触发 → 执行 session-start 脚本 -->
      <line x1="300" y1="124" x2="300" y2="160" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 3→4: 执行 session-start 脚本 → 注入 using-superpowers Skill -->
      <line x1="300" y1="192" x2="300" y2="228" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 4→5: 注入 using-superpowers Skill → Bootstrap 规则生效 -->
      <line x1="300" y1="260" x2="300" y2="296" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 5→6: Bootstrap 规则生效 → 匹配 Skill? -->
      <line x1="300" y1="328" x2="300" y2="364" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 6→7: 匹配 Skill? → 激活对应 Skill (Yes=1%, left) -->
      <polyline points="268,392 160,392 160,456" fill="none" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 1% label -->
      <rect x="208" y="380" width="24" height="12" fill="#f8fafc" rx="2"/>
      <text x="224" y="392" font-family="Geist Mono, monospace" font-size="8" fill="#3a6b8a" text-anchor="middle">1%</text>

      <!-- 6→8: 匹配 Skill? → 默认行为 (No=99%, right) -->
      <polyline points="332,392 440,392 440,456" fill="none" stroke="#3a6b8a" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 99% label -->
      <rect x="352" y="380" width="28" height="12" fill="#f8fafc" rx="2"/>
      <text x="368" y="392" font-family="Geist Mono, monospace" font-size="8" fill="#3a6b8a" text-anchor="middle">99%</text>

      <!-- 7→9: 激活对应 Skill → merge dot -->
      <line x1="160" y1="488" x2="160" y2="540" stroke="#3a6b8a" stroke-width="1.2"/>
      <line x1="160" y1="540" x2="296" y2="540" stroke="#3a6b8a" stroke-width="1.2"/>

      <!-- 8→9: 默认行为 → merge dot -->
      <line x1="440" y1="488" x2="440" y2="540" stroke="#3a6b8a" stroke-width="1.2"/>
      <line x1="440" y1="540" x2="304" y2="540" stroke="#3a6b8a" stroke-width="1.2"/>

      <!-- 9→10: merge dot → Skill 链式调用 -->
      <line x1="300" y1="540" x2="300" y2="552" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ==================== NODES ==================== -->

      <!-- 1. Oval: Claude Code 会话启动 (start) cx=300, cy=44 -->
      <ellipse cx="300" cy="44" rx="96" ry="20" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="48" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Claude Code 会话启动</text>

      <!-- 2. Rect: SessionStart Hook 触发 cx=300, y=92 -->
      <rect x="208" y="92" width="184" height="32" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="112" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">SessionStart Hook 触发</text>

      <!-- 3. Rect: 执行 session-start 脚本 cx=300, y=160 -->
      <rect x="208" y="160" width="184" height="32" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="180" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">执行 session-start 脚本</text>

      <!-- 4. Rect: 注入 using-superpowers Skill cx=300, y=228 -->
      <rect x="196" y="228" width="208" height="32" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="248" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">注入 using-superpowers Skill</text>

      <!-- 5. Rect: Bootstrap 规则生效 cx=300, y=296 -->
      <rect x="216" y="296" width="168" height="32" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="316" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Bootstrap 规则生效</text>

      <!-- 6. Diamond: 匹配 Skill? cx=300, center cy=392 -->
      <polygon points="300,364 332,392 300,420 268,392" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="300" y="396" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">匹配 Skill?</text>

      <!-- 7. Rect: 激活对应 Skill cx=160, y=456 (Yes branch, accent-tint) -->
      <rect x="88" y="456" width="144" height="32" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="160" y="476" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a5276" text-anchor="middle">激活对应 Skill</text>

      <!-- 8. Rect: 默认行为 cx=440, y=456 (No branch) -->
      <rect x="376" y="456" width="128" height="32" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <text x="440" y="476" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">默认行为</text>

      <!-- 9. Merge dot cx=300, cy=540 -->
      <circle cx="300" cy="540" r="4" fill="#1a2a3a"/>

      <!-- 10. Oval: Skill 链式调用 (end, accent) cx=300, cy=576 -->
      <ellipse cx="300" cy="576" rx="84" ry="20" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="300" y="580" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a5276" text-anchor="middle">Skill 链式调用</text>

      <!-- ==================== LEGEND ==================== -->
      <line x1="100" y1="608" x2="500" y2="608" stroke="rgba(26,42,58,0.10)" stroke-width="1"/>

      <text x="120" y="624" font-family="Geist Mono, monospace" font-size="7" font-weight="500" fill="#5a8aaa" letter-spacing="0.18em" text-transform="uppercase">LEGEND</text>

      <!-- Oval legend -->
      <ellipse cx="196" cy="624" rx="12" ry="8" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.8"/>
      <text x="216" y="628" font-family="Geist Mono, monospace" font-size="8" fill="#3a6b8a">开始 / 结束</text>

      <!-- Rectangle legend -->
      <rect x="280" y="616" width="20" height="16" rx="3" fill="#ffffff" stroke="#1a2a3a" stroke-width="0.8"/>
      <text x="308" y="628" font-family="Geist Mono, monospace" font-size="8" fill="#3a6b8a">步骤</text>

      <!-- Diamond legend -->
      <polygon points="380,616 388,624 380,632 372,624" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.8"/>
      <text x="396" y="628" font-family="Geist Mono, monospace" font-size="8" fill="#3a6b8a">判断</text>

    </svg>
  </main>
  <footer>Maestro · Plugin Ecosystem Analysis</footer>
</body>
</html>
