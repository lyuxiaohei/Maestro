<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSD v1 Workflow Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      font-family: 'Geist', sans-serif;
      color: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 600px; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #5a8aaa;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #1a2a3a;
    }
    main { width: 100%; max-width: 700px; }
    svg { width: 100%; height: auto; display: block; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(26,42,58,0.10);
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #5a8aaa;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">GSD V1 · WORKFLOW</p>
    <h1>GSD v1 Workflow Pipeline</h1>
  </header>
  <main>
    <svg viewBox="0 0 1020 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ===== ARROWS (drawn first for z-order) ===== -->

      <!-- 1 → 2: new-project → discuss-phase -->
      <line x1="128" y1="160" x2="160" y2="160" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 2 → 3: discuss-phase → plan-phase -->
      <line x1="280" y1="160" x2="300" y2="160" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 3 → 4: plan-phase → execute-phase -->
      <line x1="420" y1="160" x2="440" y2="160" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 4 → 5: execute-phase → verify-work -->
      <line x1="560" y1="160" x2="580" y2="160" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 5 → 6: verify-work → diamond -->
      <line x1="700" y1="160" x2="724" y2="160" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 6 → 7: diamond → ship (Yes) -->
      <line x1="836" y1="160" x2="872" y2="160" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <!-- Yes label -->
      <rect x="840" y="148" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="852" y="157" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">Yes</text>

      <!-- 6 → 3: diamond → plan-phase (No, curved back below) -->
      <path d="M 780 204 L 780 260 L 360 260 L 360 200" stroke="#3a6b8a" stroke-width="1" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
      <!-- No label -->
      <rect x="556" y="248" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="566" y="257" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa" text-anchor="middle">No</text>

      <!-- ===== NODES ===== -->

      <!-- 1. Start: /gsd:new-project (oval) -->
      <ellipse cx="80" cy="160" rx="48" ry="24" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="80" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">/gsd:new-project</text>

      <!-- 2. discuss-phase (rect) -->
      <rect x="160" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="220" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">discuss-phase</text>

      <!-- 3. plan-phase (rect) -->
      <rect x="300" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="360" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">plan-phase</text>

      <!-- 4. execute-phase (rect) -->
      <rect x="440" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="500" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">execute-phase</text>

      <!-- 5. verify-work (rect) -->
      <rect x="580" y="140" width="120" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="640" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">verify-work</text>

      <!-- 6. 验证通过? (diamond) -->
      <rect x="740" y="120" width="80" height="80" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1" transform="rotate(45, 780, 160)"/>
      <text x="780" y="157" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">验证</text>
      <text x="780" y="171" font-family="Geist, sans-serif" font-size="11" font-weight="600" fill="#1a2a3a" text-anchor="middle">通过?</text>

      <!-- 7. End: /gsd:ship (oval, accent) -->
      <ellipse cx="920" cy="160" rx="48" ry="24" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="920" y="164" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#1a5276" text-anchor="middle">/gsd:ship</text>

      <!-- ===== LEGEND ===== -->
      <g transform="translate(200, 296)">
        <!-- Oval -->
        <ellipse cx="12" cy="8" rx="12" ry="8" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.75"/>
        <text x="32" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Start / End</text>

        <!-- Rect -->
        <rect x="120" y="0" width="20" height="16" rx="3" fill="#ffffff" stroke="#1a2a3a" stroke-width="0.75"/>
        <text x="148" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Phase Step</text>

        <!-- Diamond -->
        <rect x="246" y="0" width="12" height="12" rx="0" fill="#f8fafc" stroke="#1a2a3a" stroke-width="0.75" transform="rotate(45, 252, 8)"/>
        <text x="272" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Decision</text>

        <!-- Dashed arrow -->
        <line x1="348" y1="8" x2="372" y2="8" stroke="#3a6b8a" stroke-width="0.75" stroke-dasharray="4 2"/>
        <text x="380" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Loop Back</text>

        <!-- Accent end -->
        <ellipse cx="468" cy="8" rx="12" ry="8" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="0.75"/>
        <text x="488" y="11" font-family="Geist Mono, monospace" font-size="8" fill="#5a8aaa">Completion</text>
      </g>
    </svg>
  </main>
  <footer>Maestro · Plugin Ecosystem Analysis</footer>
</body>
</html>
