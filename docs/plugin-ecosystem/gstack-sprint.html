<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gstack Sprint Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8fafc;
      font-family: 'Geist', sans-serif;
      color: #1a2a3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    header { text-align: center; margin-bottom: 2.5rem; max-width: 600px; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #5a8aaa;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #1a2a3a;
    }
    main { width: 100%; max-width: 960px; }
    svg { width: 100%; height: auto; display: block; }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(26,42,58,0.10);
      font-family: 'Geist Mono', monospace;
      font-size: 8px;
      color: #5a8aaa;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">GSTACK · SPRINT</p>
    <h1>gstack Sprint Workflow</h1>
  </header>
  <main>
    <svg viewBox="0 0 1040 276" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ===== ARROWS (drawn first for z-order) ===== -->

      <!-- Forward arrows: right edge → left edge of next node -->
      <!-- Right edges: 100+68=168, 240+68=308, 380+68=448, 520+68=588, 660+68=728, 800+68=868 -->
      <!-- Left edges:  240-68=172, 380-68=312, 520-68=452, 660-68=592, 800-68=732, 940-68=872 -->
      <line x1="168" y1="120" x2="172" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="308" y1="120" x2="312" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="448" y1="120" x2="452" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="588" y1="120" x2="592" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="728" y1="120" x2="732" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="868" y1="120" x2="872" y2="120" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Cycle arrow: Reflect bottom → Think bottom (curved below main flow) -->
      <path d="M 940,144 L 940,204 L 100,204 L 100,144" stroke="#1a5276" stroke-width="1" fill="none" marker-end="url(#arrow-accent)" stroke-dasharray="4 3"/>
      <!-- Cycle label with opaque background -->
      <rect x="488" y="196" width="64" height="16" rx="4" fill="#f8fafc"/>
      <text x="520" y="208" font-family="'Geist Mono', monospace" font-size="8" fill="#1a5276" text-anchor="middle">ITERATE</text>

      <!-- ===== NODES ===== -->

      <!-- Node 1: Think (accent-tint) cx=100, cy=120, w=140, h=44 -->
      <rect x="32" y="100" width="140" height="44" rx="4" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="100" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Think</text>
      <text x="100" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">CEO</text>

      <!-- Node 2: Plan cx=240 -->
      <rect x="172" y="100" width="140" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="240" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Plan</text>
      <text x="240" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">Eng Manager</text>

      <!-- Node 3: Build cx=380 -->
      <rect x="312" y="100" width="140" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="380" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Build</text>
      <text x="380" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">Developer</text>

      <!-- Node 4: Review cx=520 -->
      <rect x="452" y="100" width="140" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="520" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Review</text>
      <text x="520" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">Reviewer</text>

      <!-- Node 5: Test cx=660 -->
      <rect x="592" y="100" width="140" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="660" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Test</text>
      <text x="660" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">QA</text>

      <!-- Node 6: Ship cx=800 -->
      <rect x="732" y="100" width="140" height="44" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="800" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Ship</text>
      <text x="800" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">Release Eng</text>

      <!-- Node 7: Reflect (accent-tint) cx=940 -->
      <rect x="872" y="100" width="140" height="44" rx="4" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="940" y="128" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#1a2a3a" text-anchor="middle">Reflect</text>
      <text x="940" y="160" font-family="'Geist Mono', monospace" font-size="9" fill="#5a8aaa" text-anchor="middle">Team</text>

      <!-- ===== LEGEND ===== -->
      <rect x="32" y="240" width="12" height="12" rx="4" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="52" y="248" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">起点 / 终点节点</text>

      <rect x="160" y="240" width="12" height="12" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="180" y="248" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">流程步骤</text>

      <line x1="272" y1="248" x2="296" y2="248" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="308" y="248" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">流转方向</text>

      <line x1="400" y1="248" x2="424" y2="248" stroke="#1a5276" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>
      <text x="436" y="248" font-family="'Geist Mono', monospace" font-size="8" fill="#5a8aaa">迭代循环</text>
    </svg>
  </main>
  <footer>Maestro · Plugin Ecosystem Analysis</footer>
</body>
</html>
