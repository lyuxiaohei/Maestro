<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maestro 端到端流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #1a2a3a;
      --color-muted:   #3a6b8a;
      --color-soft:    #5a8aaa;
      --color-accent:  #1a5276;
      --color-accent-tint: rgba(26,82,118,0.08);
      --color-rule:    rgba(26,42,58,0.10);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Maestro Workflow</p>
    <h1>完整 18 阶段端到端流程</h1>

    <svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#1a5276"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ═══════ ARROWS (drawn first, behind nodes) ═══════ -->

      <!-- Main vertical flow -->
      <line x1="208" y1="56" x2="208" y2="72" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="208" y1="116" x2="208" y2="132" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="208" y1="176" x2="208" y2="192" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <line x1="208" y1="236" x2="208" y2="252" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="208" y1="296" x2="208" y2="312" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="208" y1="356" x2="208" y2="372" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="208" y1="416" x2="208" y2="432" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="208" y1="476" x2="208" y2="492" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="208" y1="536" x2="208" y2="552" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Decision → END (否) -->
      <line x1="208" y1="600" x2="208" y2="620" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- 否 label -->
      <rect x="216" y="604" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="226" y="613" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">否</text>

      <!-- Decision → Loop back (是) -->
      <path d="M160,576 L40,576 L40,94 L80,94" fill="none" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- 是 label -->
      <rect x="44" y="332" width="20" height="12" rx="2" fill="#f8fafc"/>
      <text x="54" y="341" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">是</text>

      <!-- Connection: Load Skill → Domain panel -->
      <line x1="328" y1="274" x2="440" y2="274" stroke="rgba(26,42,58,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="384" y="266" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOAD</text>

      <!-- ═══════ MAIN FLOW NODES ═══════ -->

      <!-- START -->
      <rect x="96" y="24" width="224" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="208" y="45" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户启动 Maestro</text>

      <!-- Read workflow.md -->
      <rect x="88" y="72" width="240" height="44" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="208" y="92" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">读取 workflow.md</text>
      <text x="208" y="106" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">确认当前阶段</text>

      <!-- GATE-03 -->
      <rect x="88" y="132" width="240" height="44" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="96" y="138" width="56" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="124" y="147" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-03</text>
      <text x="208" y="164" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">依赖检查</text>

      <!-- GATE-01 人工确认启动 -->
      <rect x="88" y="192" width="240" height="44" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="96" y="198" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="124" y="207" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-01</text>
      <text x="208" y="224" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">人工确认启动</text>

      <!-- Load Skill -->
      <rect x="88" y="252" width="240" height="44" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <rect x="96" y="258" width="44" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="118" y="267" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="208" y="284" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">加载 Skill 执行任务</text>

      <!-- GATE-02 -->
      <rect x="88" y="312" width="240" height="44" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="96" y="318" width="56" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="124" y="327" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-02</text>
      <text x="208" y="344" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Skill 自检</text>

      <!-- GATE-05 -->
      <rect x="88" y="372" width="240" height="44" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="96" y="378" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="124" y="387" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-05</text>
      <text x="208" y="404" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent 独立验证</text>

      <!-- GATE-01 人工确认输出 -->
      <rect x="88" y="432" width="240" height="44" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="96" y="438" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="124" y="447" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE-01</text>
      <text x="208" y="464" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">人工确认输出</text>

      <!-- Write STATE -->
      <rect x="88" y="492" width="240" height="44" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="208" y="512" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">写入 STATE.md</text>
      <text x="208" y="526" fill="#5a8aaa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">更新 workflow.md</text>

      <!-- Decision diamond -->
      <polygon points="208,552 256,576 208,600 160,576" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="208" y="579" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">N &lt; 18?</text>

      <!-- END -->
      <rect x="96" y="620" width="224" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="208" y="641" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">全流程完成</text>

      <!-- ═══════ DOMAIN REFERENCE PANEL ═══════ -->

      <text x="440" y="20" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SKILL REFERENCE</text>

      <!-- 产品域 -->
      <rect x="440" y="32" width="724" height="148" rx="6" fill="rgba(26,82,118,0.04)" stroke="rgba(26,82,118,0.15)" stroke-width="0.8"/>
      <text x="456" y="52" fill="#1a5276" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">产品域  P01–P09</text>
      <text x="456" y="76" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">meeting-minutes · diagram-design · competitive-analysis</text>
      <text x="456" y="96" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">feature-list · logic-list-spec · prototype-design</text>
      <text x="456" y="116" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">prototype-review · ui-design · prd-auto-generator</text>
      <text x="456" y="140" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace">9 skills · 调研→原型→方案</text>
      <line x1="456" y1="128" x2="1148" y2="128" stroke="rgba(26,42,58,0.08)" stroke-width="0.6"/>

      <!-- 技术域 -->
      <rect x="440" y="196" width="724" height="100" rx="6" fill="rgba(26,42,58,0.03)" stroke="rgba(26,42,58,0.12)" stroke-width="0.8"/>
      <text x="456" y="216" fill="#3a6b8a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">技术域  P10–P13</text>
      <text x="456" y="240" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">architecture-design · architecture-review</text>
      <text x="456" y="260" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">architecture-refinement · detailed-design</text>
      <text x="456" y="284" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace">4 skills · 架构→评审→细化→详细</text>
      <line x1="456" y1="272" x2="1148" y2="272" stroke="rgba(26,42,58,0.08)" stroke-width="0.6"/>

      <!-- 开发域 -->
      <rect x="440" y="312" width="724" height="100" rx="6" fill="rgba(26,42,58,0.03)" stroke="rgba(26,42,58,0.12)" stroke-width="0.8"/>
      <text x="456" y="332" fill="#3a6b8a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">开发域  P14–P15</text>
      <text x="456" y="356" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">dev-task-planner · frontend-dev</text>
      <text x="456" y="376" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">backend-dev · code-review</text>
      <text x="456" y="400" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace">4 skills · 任务规划→开发→审核</text>
      <line x1="456" y1="388" x2="1148" y2="388" stroke="rgba(26,42,58,0.08)" stroke-width="0.6"/>

      <!-- 交付域 -->
      <rect x="440" y="428" width="724" height="88" rx="6" fill="rgba(26,42,58,0.03)" stroke="rgba(26,42,58,0.12)" stroke-width="0.8"/>
      <text x="456" y="448" fill="#3a6b8a" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">交付域  P16–P18</text>
      <text x="456" y="472" fill="#1a2a3a" font-size="9" font-family="'Geist Mono', monospace">test-engineering · acceptance-testing · deployment</text>
      <text x="456" y="504" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace">3 skills · 测试→验收→部署上线</text>
      <line x1="456" y1="488" x2="1148" y2="488" stroke="rgba(26,42,58,0.08)" stroke-width="0.6"/>

      <!-- ═══════ LEGEND ═══════ -->
      <line x1="80" y1="672" x2="1160" y2="672" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>
      <text x="80" y="692" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="160" y="681" width="14" height="12" rx="4" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="180" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">自动门禁</text>

      <rect x="264" y="681" width="14" height="12" rx="4" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="284" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">人工确认</text>

      <rect x="368" y="681" width="14" height="12" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="388" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">执行步骤</text>

      <polygon points="482,681 490,687 482,693 474,687" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="498" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">决策</text>

      <line x1="548" y1="687" x2="584" y2="687" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="592" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">循环路径</text>

      <rect x="684" y="681" width="14" height="12" rx="4" fill="#ffffff" stroke="rgba(26,42,58,0.15)" stroke-width="0.8"/>
      <text x="704" y="692" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">领域 Skill</text>

    </svg>
  </div>
</body>
</html>
