<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maestro Agent 编排模式</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8fafc;
      --color-ink:     #1a2a3a;
      --color-muted:   #3a6b8a;
      --color-soft:    #5a8aaa;
      --color-accent:  #1a5276;
      --color-rule:    rgba(26,42,58,0.10);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1400px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Orchestration · Maestro Agents</p>
    <h1>Agent 编排模式</h1>

    <svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5276"/></marker>
        <marker id="arrow-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b5a2b"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- ═══════ PATTERN A: 三步执行管道 ═══════ -->

      <text x="60" y="36" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PATTERN A</text>
      <text x="148" y="36" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">三步执行管道（Planner → Checker → Executor）</text>

      <!-- GATE-03 pass -->
      <rect x="60" y="56" width="120" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="120" y="76" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GATE-03 通过</text>

      <!-- Arrow -->
      <line x1="180" y1="72" x2="220" y2="72" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- phase-planner -->
      <rect x="220" y="48" width="200" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="228" y="54" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="256" y="63" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="320" y="82" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">phase-planner</text>

      <!-- Arrow -->
      <line x1="420" y1="72" x2="460" y2="72" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <text x="440" y="64" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PLANNING</text>
      <text x="440" y="86" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">COMPLETE</text>

      <!-- plan-checker -->
      <rect x="460" y="48" width="200" height="48" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="468" y="54" width="56" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="496" y="63" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="560" y="82" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plan-checker</text>

      <!-- Arrow: checker PASS -->
      <line x1="660" y1="72" x2="700" y2="72" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <text x="680" y="64" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">PASS</text>

      <!-- Arrow: checker FAIL → back to planner -->
      <path d="M560,96 L560,112 L320,112 L320,96" fill="none" stroke="#8b5a2b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-fail)"/>
      <text x="440" y="124" fill="#8b5a2b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ISSUES FOUND → 返回 planner 修正（最多 2 轮）</text>

      <!-- phase-executor -->
      <rect x="700" y="48" width="200" height="48" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1.2"/>
      <rect x="708" y="54" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="736" y="63" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="800" y="82" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">phase-executor</text>

      <!-- Arrow -->
      <line x1="900" y1="72" x2="940" y2="72" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Output -->
      <rect x="940" y="56" width="120" height="32" rx="16" fill="rgba(26,82,118,0.06)" stroke="#1a5276" stroke-width="1"/>
      <text x="1000" y="76" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">进入 GATE-02</text>

      <!-- Checkpoint sub-flow -->
      <path d="M800,96 L800,140 L920,140" fill="none" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="920" y="126" width="140" height="28" rx="4" fill="rgba(26,42,58,0.03)" stroke="rgba(26,42,58,0.15)" stroke-width="0.8"/>
      <text x="990" y="144" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">CHECKPOINT 续跑</text>


      <!-- ═══════ PATTERN B: 并行调研 ═══════ -->

      <line x1="60" y1="180" x2="1140" y2="180" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>

      <text x="60" y="210" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PATTERN B</text>
      <text x="148" y="210" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">并行调研模式（P01–P04 产品域阶段）</text>

      <!-- Orchestrator -->
      <rect x="60" y="240" width="180" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="150" y="260" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">编排器</text>
      <text x="150" y="276" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">spawn 3 agents</text>

      <!-- Parallel arrows -->
      <line x1="240" y1="252" x2="310" y2="252" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="264" x2="310" y2="264" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <line x1="240" y1="276" x2="310" y2="276" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>

      <!-- Parallel box -->
      <rect x="280" y="232" width="12" height="56" rx="2" fill="rgba(26,82,118,0.10)" stroke="rgba(26,82,118,0.30)" stroke-width="1"/>
      <text x="286" y="302" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">||</text>

      <!-- domain-researcher -->
      <rect x="310" y="228" width="200" height="36" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="410" y="250" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">domain-researcher</text>
      <text x="410" y="260" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">领域知识</text>

      <!-- competitive-researcher -->
      <rect x="310" y="268" width="200" height="36" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="410" y="290" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">competitive-researcher</text>
      <text x="410" y="300" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">竞品信息</text>

      <!-- requirement-analyst -->
      <rect x="310" y="248" width="200" height="36" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1" y="308"/>
      <text x="410" y="330" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">requirement-analyst</text>
      <text x="410" y="340" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">需求分析</text>

      <!-- Converge arrows -->
      <line x1="510" y1="246" x2="570" y2="246" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="510" y1="286" x2="570" y2="286" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="510" y1="326" x2="570" y2="326" stroke="#3a6b8a" stroke-width="1"/>

      <!-- Converge box -->
      <rect x="560" y="232" width="12" height="104" rx="2" fill="rgba(26,42,58,0.06)" stroke="rgba(26,42,58,0.15)" stroke-width="1"/>

      <!-- Arrow to synthesizer -->
      <line x1="572" y1="284" x2="630" y2="284" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>

      <!-- research-synthesizer -->
      <rect x="630" y="260" width="220" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <rect x="638" y="266" width="56" height="12" rx="2" fill="transparent" stroke="rgba(26,82,118,0.40)" stroke-width="0.8"/>
      <text x="666" y="275" fill="rgba(26,82,118,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="740" y="296" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">research-synthesizer</text>

      <!-- Arrow to output -->
      <line x1="850" y1="284" x2="920" y2="284" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="885" y="276" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SYNTHESIS</text>

      <!-- Output -->
      <rect x="920" y="268" width="180" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="1010" y="288" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">综合调研报告</text>


      <!-- ═══════ PATTERN C: 文档管道 ═══════ -->

      <line x1="60" y1="380" x2="1140" y2="380" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>

      <text x="60" y="410" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PATTERN C</text>
      <text x="148" y="410" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">文档管道（GATE-05 通过后、GATE-01 确认前）</text>

      <!-- GATE-05 pass -->
      <rect x="60" y="436" width="120" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="120" y="456" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GATE-05 通过</text>

      <line x1="180" y1="452" x2="220" y2="452" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- doc-classifier -->
      <rect x="220" y="432" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="300" y="448" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">doc-classifier</text>
      <text x="300" y="464" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">文档分类</text>

      <line x1="380" y1="452" x2="420" y2="452" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- doc-synthesizer -->
      <rect x="420" y="432" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="500" y="448" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">doc-synthesizer</text>
      <text x="500" y="464" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">合并综合</text>

      <line x1="580" y1="452" x2="620" y2="452" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- doc-writer -->
      <rect x="620" y="432" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="700" y="448" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">doc-writer</text>
      <text x="700" y="464" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">模板撰写</text>

      <line x1="780" y1="452" x2="820" y2="452" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- doc-verifier -->
      <rect x="820" y="432" width="160" height="40" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="900" y="448" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">doc-verifier</text>
      <text x="900" y="464" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">事实校验</text>

      <line x1="980" y1="452" x2="1020" y2="452" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>

      <!-- Output -->
      <rect x="1020" y="436" width="120" height="32" rx="16" fill="rgba(26,82,118,0.06)" stroke="#1a5276" stroke-width="1"/>
      <text x="1080" y="456" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">进入 GATE-01</text>

      <!-- doc-verifier fail loop -->
      <path d="M900,472 L900,500 L700,500 L700,472" fill="none" stroke="#8b5a2b" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-fail)"/>
      <text x="800" y="514" fill="#8b5a2b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">不一致 → 返回 writer 修正（最多 1 轮）</text>


      <!-- ═══════ PATTERN D: 专项验证 ═══════ -->

      <line x1="60" y1="540" x2="1140" y2="540" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>

      <text x="60" y="570" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PATTERN D</text>
      <text x="148" y="570" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">专项验证（与 phase-validator 并行运行）</text>

      <!-- phase-validator -->
      <rect x="60" y="596" width="220" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="170" y="618" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">phase-validator</text>
      <text x="170" y="634" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">通用验证（所有阶段）</text>

      <!-- Parallel indicator -->
      <rect x="310" y="596" width="20" height="104" rx="2" fill="rgba(26,82,118,0.06)" stroke="rgba(26,82,118,0.20)" stroke-width="0.8"/>
      <text x="320" y="652" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" writing-mode="tb">并行</text>

      <!-- P13: security-reviewer -->
      <rect x="360" y="596" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="616" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">P13 详细设计阶段</text>
      <text x="480" y="634" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">security-reviewer</text>

      <!-- Arrow from P13 result -->
      <line x1="600" y1="620" x2="660" y2="620" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Merge -->
      <rect x="660" y="604" width="120" height="32" rx="16" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="720" y="624" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">合并结果</text>

      <!-- P15-P16: integration-reviewer -->
      <rect x="360" y="656" width="240" height="48" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="676" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">P15-P16 开发测试阶段</text>
      <text x="480" y="694" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">integration-reviewer</text>

      <!-- Arrow from P15 result -->
      <line x1="600" y1="680" x2="660" y2="680" stroke="#3a6b8a" stroke-width="1"/>

      <!-- Arrow to GATE-01 -->
      <line x1="780" y1="620" x2="840" y2="620" stroke="#1a5276" stroke-width="1" marker-end="url(#arrow-accent)"/>

      <!-- Final -->
      <rect x="840" y="604" width="180" height="32" rx="16" fill="rgba(26,82,118,0.06)" stroke="#1a5276" stroke-width="1"/>
      <text x="930" y="624" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">统一进入 GATE-01</text>


      <!-- ═══════ LEGEND ═══════ -->
      <line x1="60" y1="760" x2="1140" y2="760" stroke="rgba(26,42,58,0.10)" stroke-width="0.8"/>
      <text x="60" y="784" fill="#3a6b8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="773" width="14" height="12" rx="4" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1"/>
      <text x="160" y="784" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">Agent 节点</text>

      <rect x="260" y="773" width="14" height="12" rx="4" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="280" y="784" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">处理步骤</text>

      <line x1="380" y1="779" x2="416" y2="779" stroke="#1a5276" stroke-width="1.2"/>
      <text x="424" y="784" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">顺序流</text>

      <line x1="500" y1="779" x2="536" y2="779" stroke="#8b5a2b" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="544" y="784" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">失败返回</text>

      <rect x="640" y="773" width="14" height="12" rx="4" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="660" y="784" fill="#3a6b8a" font-size="9" font-family="'Geist', sans-serif">验证步骤</text>

    </svg>
  </div>
</body>
</html>
