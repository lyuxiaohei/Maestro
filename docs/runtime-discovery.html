<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行时发现机制</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f8fafc; --color-ink: #1a2a3a; --color-muted: #3a6b8a;
      --color-soft: #5a8aaa; --color-accent: #1a5276;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Plugin System</p>
    <h1>运行时发现机制</h1>

    <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5276"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Arrows -->
      <line x1="480" y1="48" x2="480" y2="96" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- diamond YES (from left point 400,144) -->
      <line x1="400" y1="144" x2="248" y2="144" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="248" y1="144" x2="248" y2="192" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- diamond NO (from right point 560,144) -->
      <line x1="560" y1="144" x2="712" y2="144" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="712" y1="144" x2="712" y2="192" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- both → merge -->
      <line x1="248" y1="232" x2="248" y2="260" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="712" y1="232" x2="712" y2="260" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="248" y1="260" x2="712" y2="260" stroke="#3a6b8a" stroke-width="1"/>
      <circle cx="480" cy="260" r="4" fill="#1a2a3a"/>
      <line x1="480" y1="264" x2="480" y2="288" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- register → hook -->
      <line x1="480" y1="328" x2="480" y2="352" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- hook → mcp -->
      <line x1="480" y1="392" x2="480" y2="416" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- mcp → wait -->
      <line x1="480" y1="456" x2="480" y2="480" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- 3 intent arrows from wait -->
      <line x1="420" y1="512" x2="200" y2="512" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="200" y1="512" x2="200" y2="540" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="528" x2="480" y2="540" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="540" y1="512" x2="760" y2="512" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="760" y1="512" x2="760" y2="540" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 3 results → done -->
      <line x1="200" y1="580" x2="200" y2="612" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="480" y1="580" x2="480" y2="612" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="760" y1="580" x2="760" y2="612" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="200" y1="612" x2="760" y2="612" stroke="#3a6b8a" stroke-width="1"/>
      <circle cx="480" cy="612" r="4" fill="#1a2a3a"/>

      <!-- Labels -->
      <rect x="296" y="132" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="312" y="140" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="596" y="132" width="24" height="12" rx="2" fill="#f8fafc"/>
      <text x="608" y="140" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

      <!-- Nodes -->
      <!-- Start -->
      <rect x="408" y="16" width="144" height="32" rx="20" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="480" y="37" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code 启动</text>

      <!-- Diamond: plugin.json? -->
      <polygon points="480,96 560,144 480,192 400,144" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="140" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plugin.json</text>
      <text x="480" y="152" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">存在？</text>

      <!-- YES: parse -->
      <rect x="168" y="192" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="248" y="216" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">解析组件路径和元数据</text>

      <!-- NO: auto-discover -->
      <rect x="632" y="192" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="712" y="216" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">自动发现默认目录</text>

      <!-- Register skills -->
      <rect x="340" y="288" width="280" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="312" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">注册 Skill description 到 available_skills</text>

      <!-- SessionStart Hook -->
      <rect x="360" y="352" width="240" height="40" rx="6" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <rect x="368" y="358" width="40" height="12" rx="2" fill="transparent" stroke="rgba(58,107,138,0.40)" stroke-width="0.8"/>
      <text x="388" y="367" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="480" y="382" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">触发 SessionStart Hook</text>

      <!-- MCP Servers -->
      <rect x="340" y="416" width="280" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="480" y="440" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">启动 MCP Servers，注册为标准工具</text>

      <!-- Wait for user -->
      <rect x="360" y="480" width="240" height="48" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="480" y="508" fill="#1a2a3a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">等待用户请求</text>

      <!-- Intent: Skill -->
      <rect x="120" y="540" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <rect x="128" y="546" width="44" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="150" y="555" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
      <text x="200" y="570" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">主窗口执行任务</text>

      <!-- Intent: Agent -->
      <rect x="400" y="540" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <rect x="408" y="546" width="48" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="432" y="555" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="480" y="570" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">独立上下文执行</text>

      <!-- Intent: Hook -->
      <rect x="680" y="540" width="160" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <rect x="688" y="546" width="40" height="12" rx="2" fill="transparent" stroke="rgba(26,42,58,0.40)" stroke-width="0.8"/>
      <text x="708" y="555" fill="rgba(26,42,58,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
      <text x="760" y="570" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">自动响应事件</text>
    </svg>
  </div>
</body>
</html>
