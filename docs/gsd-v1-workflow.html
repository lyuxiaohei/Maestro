<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSD v1 核心工作流</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f8fafc; --color-ink: #1a2a3a; --color-muted: #3a6b8a;
      --color-soft: #5a8aaa; --color-accent: #1a5276;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · GSD v1</p>
    <h1>GSD v1 核心工作流</h1>

    <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3a6b8a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1a5276"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- Main vertical flow -->
      <line x1="260" y1="48" x2="260" y2="80" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="120" x2="260" y2="152" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="192" x2="260" y2="224" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="264" x2="260" y2="296" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- execute → subagents -->
      <line x1="320" y1="316" x2="440" y2="316" stroke="#3a6b8a" stroke-width="1"/>
      <!-- 4 subagent arrows -->
      <line x1="440" y1="316" x2="440" y2="352" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="520" y1="316" x2="520" y2="352" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="600" y1="316" x2="600" y2="352" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="680" y1="316" x2="680" y2="352" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="440" y1="316" x2="680" y2="316" stroke="#3a6b8a" stroke-width="1"/>

      <!-- subagents → merge -->
      <line x1="440" y1="392" x2="440" y2="420" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="520" y1="392" x2="520" y2="420" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="600" y1="392" x2="600" y2="420" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="680" y1="392" x2="680" y2="420" stroke="#3a6b8a" stroke-width="1"/>
      <line x1="440" y1="420" x2="680" y2="420" stroke="#3a6b8a" stroke-width="1"/>
      <circle cx="560" cy="420" r="4" fill="#1a2a3a"/>
      <line x1="560" y1="424" x2="560" y2="448" stroke="#3a6b8a" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Phase done? diamond -->
      <line x1="560" y1="496" x2="560" y2="524" stroke="#3a6b8a" stroke-width="1"/>
      <!-- NO: loop back to execute -->
      <line x1="620" y1="472" x2="820" y2="472" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="820" y1="472" x2="820" y2="316" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="820" y1="316" x2="320" y2="316" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <!-- YES: verify-work -->
      <line x1="560" y1="524" x2="560" y2="548" stroke="#1a5276" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- all phases done? -->
      <line x1="560" y1="588" x2="560" y2="612" stroke="#3a6b8a" stroke-width="1"/>
      <!-- NO: loop back to plan -->
      <line x1="620" y1="636" x2="860" y2="636" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="860" y1="636" x2="860" y2="244" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <line x1="860" y1="244" x2="400" y2="244" stroke="#3a6b8a" stroke-width="1" stroke-dasharray="5,4"/>
      <!-- YES: ship -->
      <line x1="560" y1="660" x2="560" y2="668" stroke="#1a5276" stroke-width="1.2"/>

      <!-- Labels -->
      <rect x="576" y="480" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="590" y="489" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="540" y="508" width="32" height="12" rx="2" fill="#f8fafc"/>
      <text x="556" y="517" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="576" y="644" width="28" height="12" rx="2" fill="#f8fafc"/>
      <text x="590" y="653" fill="#5a8aaa" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

      <!-- ── MAIN FLOW NODES ── -->
      <rect x="168" y="16" width="184" height="32" rx="20" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="260" y="37" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:new-project</text>

      <rect x="120" y="80" width="280" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="260" y="100" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">创建项目路线图 .planning/roadmap.md</text>

      <rect x="120" y="152" width="280" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="260" y="172" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:discuss-phase → 锁定 SPEC</text>

      <rect x="120" y="224" width="280" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="260" y="244" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:plan-phase → 生成执行计划</text>

      <rect x="120" y="296" width="200" height="40" rx="6" fill="rgba(26,82,118,0.08)" stroke="#1a5276" stroke-width="1.2"/>
      <text x="220" y="320" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:execute-phase</text>

      <!-- ── SUBAGENT NODES ── -->
      <rect x="392" y="352" width="96" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="440" y="368" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESEARCH</text>
      <text x="440" y="384" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">研究</text>

      <rect x="472" y="352" width="96" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="520" y="368" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="520" y="384" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">计划</text>

      <rect x="552" y="352" width="96" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="600" y="368" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTE</text>
      <text x="600" y="384" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">执行</text>

      <rect x="632" y="352" width="96" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="680" y="368" fill="#5a8aaa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY</text>
      <text x="680" y="384" fill="#1a2a3a" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">验证</text>

      <!-- ── DECISION DIAMONDS ── -->
      <polygon points="560,448 620,472 560,496 500,472" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="560" y="476" fill="#1a2a3a" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phase 完成？</text>

      <rect x="460" y="548" width="200" height="40" rx="6" fill="#ffffff" stroke="#1a2a3a" stroke-width="1"/>
      <text x="560" y="572" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:verify-work</text>

      <polygon points="560,612 620,636 560,660 500,636" fill="#f8fafc" stroke="#1a2a3a" stroke-width="1"/>
      <text x="560" y="640" fill="#1a2a3a" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">全部 Phase 完成？</text>

      <rect x="488" y="668" width="144" height="32" rx="20" fill="rgba(26,42,58,0.05)" stroke="#3a6b8a" stroke-width="1"/>
      <text x="560" y="689" fill="#1a2a3a" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/gsd:ship 发布</text>
    </svg>
  </div>
</body>
</html>
